<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winter Arc</title>
<meta name="description" content="Adaptive winter training plan.">
<meta name="theme-color" content="#d6f0ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d28" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:600;font-display:swap;src:url(ChakraPetch-SemiBold.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:italic;font-weight:600;font-display:swap;src:url(ChakraPetch-SemiBoldItalic.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:italic;font-weight:700;font-display:swap;src:url(ChakraPetch-BoldItalic.woff2) format("woff2")}
@font-face{font-family:"Dela Gothic One";font-style:normal;font-weight:400;font-display:swap;src:url(DelaGothicOne-Regular.woff2) format("woff2")}
@font-face{font-family:"M PLUS 1p";font-style:normal;font-weight:400;font-display:swap;src:url(MPLUS1p-Regular.woff2) format("woff2")}
@font-face{font-family:"M PLUS 1p";font-style:normal;font-weight:500;font-display:swap;src:url(MPLUS1p-Medium.woff2) format("woff2")}
@font-face{font-family:"M PLUS 1p";font-style:normal;font-weight:700;font-display:swap;src:url(MPLUS1p-Bold.woff2) format("woff2")}
@font-face{font-family:"M PLUS 1p";font-style:normal;font-weight:800;font-display:swap;src:url(MPLUS1p-ExtraBold.woff2) format("woff2")}
</style>
<style>
/* Layout: a colour-spread manga page on a phone. A title-card hero, a full-bleed rival band that breaks the column, then one calm quest sheet. Ink outlines, flat fills, no blur. */
:root{
  color-scheme: light;
  --page:#d6f0ff; --paper:#fffaf0; --paper2:#ffeeb0; --raise:#ffffff; --line:#15102e; --ctl:#15102e; --rule:#e4dbc4; --fg:#15102e; --muted:#4f4a72; --link:#1746d1;
  --ink:#15102e; --onb:#15102e; --white:#ffffff;
  --yellow:#ffd60a; --orange:#ff7a1a; --sky:#27b3ff; --royal:#1746d1; --pink:#ff5fa0; --green:#2fd98a; --violet:#a98bff; --red:#ef3b2d;
  --burst:rgba(23,70,209,.10); --sky1:#38b6ff; --sky2:#bfe8ff; --sky3:#eaf7ff; --spark:#ffffff; --lines:rgba(255,255,255,.55); --dots:rgba(23,70,209,.16); --dsa:#27b3ff; --prob:#ff5fa0; --build:#2fd98a; --trade:#a98bff; --hw:#c8f03c;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  --hud:"Chakra Petch","Arial Narrow","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --burst:rgba(179,187,255,.07); --sky1:#05061a; --sky2:#140c3f; --sky3:#2a0d4d; --spark:#ffffff; --lines:rgba(255,255,255,.09); --dots:rgba(179,187,255,.10); --page:#0b0d28; --paper:#171c50; --paper2:#262e7a; --raise:#0f1238; --line:#b3bbff; --ctl:#b3bbff; --rule:#2e3684; --fg:#f4f2ff; --muted:#aab0e6; --link:#a9c4ff;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --burst:rgba(179,187,255,.07); --sky1:#05061a; --sky2:#140c3f; --sky3:#2a0d4d; --spark:#ffffff; --lines:rgba(255,255,255,.09); --dots:rgba(179,187,255,.10); --page:#0b0d28; --paper:#171c50; --paper2:#262e7a; --raise:#0f1238; --line:#b3bbff; --ctl:#b3bbff; --rule:#2e3684; --fg:#f4f2ff; --muted:#aab0e6; --link:#a9c4ff;
}
*{box-sizing:border-box}
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;display:block}
@supports (height:100lvh){#sky{height:100lvh}}
body{background:var(--page);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--page)}
.app{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
a{color:var(--link);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* ---------- hero ---------- */
.splashw{margin-top:14px;filter:drop-shadow(6px 6px 0 var(--line))}
.splashc{background:var(--ink);padding:3px;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,30px 100%,0 calc(100% - 30px))}
.splash{position:relative;isolation:isolate;overflow:hidden;background:var(--sky);color:var(--onb);
  clip-path:polygon(0 0,calc(100% - 29px) 0,100% 29px,100% 100%,29px 100%,0 calc(100% - 29px));
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 6px;padding:14px 16px 16px}
.splash::before{content:"";position:absolute;inset:0;z-index:-2;
  background:repeating-conic-gradient(from 3deg at 84% 43%,var(--white) 0 1.2deg,transparent 1.2deg 6.5deg);opacity:.6;
  -webkit-mask-image:radial-gradient(circle at 84% 43%,transparent 0 60px,#000 210px);mask-image:radial-gradient(circle at 84% 43%,transparent 0 60px,#000 210px)}
.eyebrow{display:inline-block;background:var(--white);color:var(--onb);border:3px solid var(--ink);padding:0 10px 1px;font-family:var(--hud);font-style:italic;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em;transform:skewX(-9deg)}
.eyebrow>span{display:inline-block;transform:skewX(9deg)}
.spl-l{display:flex;flex-direction:column;gap:12px;min-width:0;align-items:flex-start}
.spl-l h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10.2vw,78px);line-height:.9;text-transform:uppercase;color:var(--yellow);
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink);transform:rotate(-5deg) skewX(-7deg);transform-origin:left center;margin:6px 0 8px 4px}
.spl-l h1 em{font-style:normal;color:var(--orange)}
.spl-r{position:relative;width:104px;height:128px;align-self:center}
#aura{position:absolute;inset:0;width:100%;height:100%}
.emblem{position:absolute;left:50%;bottom:10px;width:54px;height:54px;margin-left:-27px;background:var(--white);border:3px solid var(--ink);transform:rotate(45deg);display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.emblem b{transform:rotate(-45deg);font-family:var(--display);font-weight:400;font-size:28px;line-height:1;color:var(--onb)}
.power{grid-column:1/-1;background:var(--ink);color:var(--white);margin:12px -16px -16px;padding:9px 20px 12px 36px;display:flex;flex-direction:column;gap:6px}
.powlab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--hud);font-style:italic;font-weight:700;font-size:15px;text-transform:uppercase}
.meter{height:18px;border:3px solid var(--white);transform:skewX(-14deg);overflow:hidden;margin-inline:3px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(-46deg,var(--yellow) 0 9px,var(--orange) 9px 18px)}
.loadrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:36px;font-family:var(--hud);font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em}
.load{position:relative;background:var(--yellow);color:var(--onb);border:0;padding:5px 14px 6px;min-height:36px;transform:skewX(-9deg);font-family:var(--hud);font-style:italic;font-weight:700;font-size:14px;text-transform:uppercase}
.load::before{content:"";position:absolute;inset:-6px -4px}
.load>span{display:inline-block;transform:skewX(9deg)}
.compact .splash{padding:10px 14px 16px}
.compact .eyebrow,.compact #aura,.compact .loadrow{display:none}
.compact .spl-l{gap:0}
.compact .spl-l h1{font-size:25px;margin:4px 0 2px 2px;-webkit-text-stroke-width:5px;text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg) skewX(-7deg)}
.compact .spl-r{width:46px;height:42px}
.compact .emblem{width:32px;height:32px;margin-left:-16px;bottom:5px;box-shadow:2px 2px 0 var(--ink)}
.compact .emblem b{font-size:17px}
.compact .power{margin-top:8px}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;display:flex;gap:6px;padding:12px 3px 13px;background:color-mix(in srgb,var(--page) 78%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tabs button{flex:1 1 auto;min-width:0;min-height:44px;transform:skewX(-9deg);background:var(--raise);color:var(--fg);border:3px solid var(--line);padding:5px 3px 6px;font-family:var(--hud);font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase}
.tabs button>span{display:inline-block;transform:skewX(9deg)}
.tabs button[aria-selected="true"]{background:var(--yellow);color:var(--onb);border-color:var(--ink);box-shadow:0 5px 0 var(--line)}

main{display:flex;flex-direction:column;gap:22px;min-width:0;padding-top:4px}

/* ---------- panels ---------- */
.pw{position:relative;min-width:0}
.pc{background:var(--line);padding:3px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.pin{background:var(--paper);clip-path:polygon(0 0,calc(100% - 17px) 0,100% 17px,100% 100%,17px 100%,0 calc(100% - 17px));padding:22px 14px 14px;display:flex;flex-direction:column;min-width:0}
.pw>.lab{position:absolute;top:-14px;left:10px;z-index:2}
.lab{display:inline-block;margin:0;transform:skewX(-9deg) rotate(-1.5deg);background:var(--c,var(--yellow));color:var(--onb);border:3px solid var(--ink);padding:1px 12px 3px;font-family:var(--display);font-weight:400;font-size:15px;line-height:1.35}
.lab>span{display:inline-block;transform:skewX(9deg)}
.sub{font-family:var(--hud);font-style:italic;font-weight:600;font-size:13.5px;color:var(--muted);margin:0 0 6px}
[data-t="dsa"]{--c:var(--dsa)} [data-t="prob"]{--c:var(--prob)} [data-t="trade"]{--c:var(--trade)} [data-t="build"]{--c:var(--build)} [data-t="hw"]{--c:var(--hw)} [data-t="admin"]{--c:var(--orange)}
.txt{font-size:14.5px;max-width:64ch}
.muted{color:var(--muted)}

/* ---------- coach and deadlines ---------- */
.top{display:flex;flex-direction:column;gap:12px}
.coach{display:flex;gap:14px;align-items:flex-start}
.sensei{flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--line);display:grid;place-items:center;font-family:var(--display);font-size:23px;line-height:1;color:var(--onb);transform:rotate(-6deg)}
.balloon{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:8px 14px 10px;font-weight:500;font-size:15px;line-height:1.4}
.balloon::before{content:"";position:absolute;top:15px;left:-11px;width:17px;height:17px;background:var(--paper);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg) skewX(14deg)}
.balloon .who{display:block;font-family:var(--hud);font-style:italic;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.balloon small{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;font-weight:400}
.dl{background:var(--orange);color:var(--onb);border:3px solid var(--ink)}
.dl>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:6px 40px 7px 8px;min-height:52px;position:relative}
.dl>summary::-webkit-details-marker{display:none}
.dl>summary::after{content:"";position:absolute;right:16px;top:19px;width:9px;height:9px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.dl[open]>summary::after{transform:rotate(-135deg);top:24px}
.dln{flex:0 0 auto;min-width:34px;height:34px;display:grid;place-items:center;background:var(--white);border:3px solid var(--ink);transform:skewX(-9deg);font-family:var(--display);font-size:17px;line-height:1}
.dln.hot{background:var(--red);color:var(--white)}
.dlt{display:flex;flex-direction:column;min-width:0;font-weight:800;font-size:15px;line-height:1.25}
.dlt small{font-family:var(--hud);font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.dlb{background:var(--paper);color:var(--fg);border-top:3px solid var(--ink);padding:0 4px 4px 12px}

/* ---------- rival band ---------- */
.vs{position:relative;isolation:isolate;margin:20px -16px 4px;padding:9px 16px 11px 108px;min-height:92px;background:var(--red);color:var(--onb);border-block:3px solid var(--ink);display:flex;flex-direction:column;gap:5px;justify-content:center}
.vs::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle,var(--ink) 1.7px,transparent 2.1px) 0 0/9px 9px;opacity:.2;-webkit-mask-image:linear-gradient(250deg,#000,transparent 50%);mask-image:linear-gradient(250deg,#000,transparent 50%)}
.mask{position:absolute;left:14px;top:-24px;width:82px;height:94px}
.mask .mi{fill:var(--ink)} .mask .mf{fill:var(--white)} .mask .me{fill:var(--yellow);stroke:var(--ink);stroke-width:2;stroke-linejoin:round} .mask .mm{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mask .my{fill:var(--yellow)} .mask .mv{font-family:var(--display);font-size:21px;fill:var(--ink)} .mask .mn{font-family:var(--hud);font-weight:700;font-style:italic;font-size:9px;fill:var(--ink)}
.vsl{font-family:var(--hud);font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.rname{font-family:var(--display);font-size:clamp(19px,5.6vw,30px);line-height:1.12;letter-spacing:.03em;color:var(--white);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;overflow-wrap:anywhere}
.hp{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:2px 3px 0}
.hp i{height:14px;border:2.5px solid var(--ink);background:var(--yellow);transform:skewX(-14deg)}
.hp i.off{background:var(--ink);opacity:.5}
.hpn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--hud);font-style:italic;font-weight:700;font-size:14px;text-transform:uppercase;color:var(--white);text-shadow:1.5px 1.5px 0 var(--ink)}
.stamp{position:absolute;right:12px;top:-14px;transform:rotate(6deg);border:3px solid var(--ink);background:var(--green);color:var(--onb);font-family:var(--display);font-size:14px;padding:0 10px 2px}

/* ---------- quest sheet ---------- */
.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 2px}
.pin>.grp:first-child,.sub+.grp{padding-top:2px}
.gchip{transform:skewX(-9deg);background:var(--c,var(--raise));color:var(--onb);border:3px solid var(--ink);padding:0 10px 2px;font-family:var(--display);font-size:13.5px;line-height:1.5}
.gchip.plain{background:var(--raise);color:var(--fg);border-color:var(--ctl)}
.gchip>span{display:inline-block;transform:skewX(9deg)}
.gsub{font-family:var(--hud);font-style:italic;font-weight:600;font-size:13.5px;color:var(--muted)}
.glab{font-family:var(--hud);font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:14px 0 2px}
.q{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:start;border-top:2px solid var(--rule);min-width:0}
.grp+.q,.glab+.q,.dlb>.q:first-child{border-top:0}
.qtick{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;padding:11px 0;min-height:52px;min-width:0}
.chk{flex:0 0 auto;width:28px;height:28px;border:3px solid var(--ctl);background:var(--raise);position:relative;margin-top:1px}
.qtick[aria-pressed="true"] .chk{background:var(--c,var(--yellow));border-color:var(--ink);transform:rotate(-7deg)}
.qtick[aria-pressed="true"] .chk::after{content:"";position:absolute;left:7px;top:0;width:8px;height:15px;border:solid var(--onb);border-width:0 4px 4px 0;transform:rotate(42deg)}
.qtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.qt{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.q.done .qt{color:var(--muted);font-weight:500}
.q.done .qm{display:none}
.q.done .qtick{min-height:46px;padding:8px 0}
.qm{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.xp{font-family:var(--hud);font-style:italic;font-weight:700;font-size:13.5px;color:var(--muted)}
.tag{font-family:var(--hud);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;border:2px solid var(--line);padding:0 6px;background:var(--paper2);color:var(--fg);line-height:18px}
.tag.hot{background:var(--red);color:var(--white);border-color:var(--ink)} .tag.soon{background:var(--orange);color:var(--onb);border-color:var(--ink)} .tag.good{background:var(--green);color:var(--onb);border-color:var(--ink)} .tag.warn{background:var(--yellow);color:var(--onb);border-color:var(--ink)}
.qx{width:44px;height:50px;background:none;border:0;position:relative}
.qx::after{content:"";position:absolute;left:16px;top:17px;width:9px;height:9px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg)}
.qx[aria-expanded="true"]::after{transform:rotate(-135deg);top:22px}
.qd{grid-column:1/-1;padding:0 8px 12px 40px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.qd p{max-width:60ch}
.qk{grid-column:1/-1;padding:0 0 10px 40px}
.links{display:flex;gap:14px;flex-wrap:wrap}
.ghost{background:var(--paper2);color:var(--fg);border:2px solid var(--line);min-height:36px;padding:2px 10px;font-family:var(--hud);font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase}
.morebtn{margin-top:14px;min-height:46px;background:var(--raise);color:var(--fg);border:3px solid var(--ctl);font-family:var(--hud);font-style:italic;font-weight:700;font-size:14px;text-transform:uppercase}
details.donebox>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--hud);font-style:italic;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dailies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.dbtn{position:relative;min-height:66px;background:var(--raise);color:var(--fg);border:3px solid var(--ctl);padding:8px 8px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.dbtn b{font-size:14px;line-height:1.2}
.dbtn span{font-size:12.5px;line-height:1.3;color:var(--muted)}
.dbtn[aria-pressed="true"]{background:var(--yellow);border-color:var(--ink);color:var(--onb)}
.dbtn[aria-pressed="true"] span{color:var(--onb)}
.dbtn[aria-pressed="true"] b{padding-right:20px}
.dbtn[aria-pressed="true"]::after{content:"";position:absolute;right:10px;top:6px;width:7px;height:14px;border:solid var(--onb);border-width:0 4px 4px 0;transform:rotate(42deg)}
input,select,textarea{font-size:16px}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
textarea{font:inherit;font-family:var(--hud);font-weight:600;color:var(--fg);background:var(--raise);border:3px solid var(--ctl);border-radius:0;padding:7px 8px;width:100%;min-height:88px;resize:vertical}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn.ghost{background:var(--raise);color:var(--fg);border:3px solid var(--ctl);min-height:44px;padding:5px 16px 7px;font-family:var(--display);font-style:normal;font-weight:400;font-size:14px;text-transform:none}
.syncdot{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px;transform:rotate(45deg)}
.syncdot.ok{background:var(--green)} .syncdot.wait{background:var(--yellow)} .syncdot.bad{background:var(--red)} .syncdot.off{background:transparent}
.smsg{margin:10px 0 0;font-size:13.5px;line-height:1.45}
.smsg.bad{color:var(--red)}
.voices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.uiline{margin:10px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.uiline b{color:var(--fg)}
.forms{list-style:none;margin:0;padding:0;display:grid;gap:6px}

.ev{display:grid;grid-template-columns:minmax(0,1fr) 44px;border-top:2px solid var(--rule);padding:12px 0 10px;min-width:0}
.txt+.ev{border-top:0}

{id:"d34",t:"dsa",p:2,h:5,title:"AtCoder DP contest, G to M",d:"Longest Path through Candies. Harder; this is where DP starts to feel like contest DP.",l:[["AtCoder DP",L.atdp]]},
{id:"d35",t:"dsa",p:2,h:5,n:7,title:"NeetCode: Greedy and Intervals",d:"Maximum Subarray, Jump Game, Jump Game II, Gas Station, Insert Interval, Merge Intervals, Non-overlapping Intervals.",l:[NC]},
{id:"d36",t:"dsa",p:1,h:5,c:2,title:"Shortest paths and union-find",d:"USACO Guide Gold: 'Shortest Paths with Non-Negative Edge Weights' and 'Disjoint Set Union'. Then CSES Shortest Routes I and Road Construction.",l:[UG,CS]},
{id:"d37",t:"dsa",p:2,h:3.5,c:2,title:"Topological sort",d:"USACO Guide Gold 'Topological Sort', then CSES Course Schedule and Longest Flight Route.",l:[UG,CS]},
{id:"d38",t:"dsa",p:1,h:3.5,k:1,title:"Your first rated Codeforces round",d:"Any live Div 3 or Div 2. The rating you get does not matter; sitting a live round does. Upsolve after.",l:[CF]},
{id:"d39",t:"dsa",p:1,h:4,k:1,title:"Codefest rehearsal",d:"Run last year's IICPC Codefest prelims mirror as a virtual contest, then upsolve. This tells you where you stand before the real prelims.",l:[["Prelims mirror",L.cfm]]},
{id:"d40",t:"dsa",p:3,h:5,c:6,title:"Bonus: CSES Range Queries 1 to 6",d:"Prefix sums, then your first Fenwick tree or segment tree.",l:[CS]},
{id:"d41",t:"dsa",p:3,h:4,n:8,title:"Bonus: bit manipulation and math",d:"NeetCode Bit Manipulation and Math sections, Easy and Medium only.",l:[NC]},
{id:"d42",t:"dsa",p:3,h:7,k:2,title:"Bonus: two more virtual contests",d:"Div 2 rounds. Upsolve one problem past where you stopped.",l:[CF]},

/* ---- PROBABILITY ---- */
{id:"p01",t:"prob",p:1,h:4,title:"Conditional expectation, out loud",d:"Twelve exercises from Blitzstein chapter 9 (Adam's law, Eve's law), solved aloud with no notes. This is the most-asked idea in trading interviews.",l:[["Stat 110",L.s110]]},
{id:"p02",t:"prob",p:1,h:4.5,title:"Blitzstein chapter 11, Markov chains, part 1",d:"Sections 11.1 to 11.3: the Markov property, classification of states, stationary distributions. Six exercises.",l:[["Stat 110",L.s110]]},
{id:"p03",t:"prob",p:1,h:4.5,title:"Blitzstein chapter 11, part 2",d:"Section 11.4 on reversibility and random walks on graphs. Six exercises. Practise first-step analysis until setting up the equations is routine.",l:[["Stat 110",L.s110]]},
{id:"p04",t:"prob",p:1,h:4,title:"Green Book 2.1 to 2.3",d:"Problem simplification, logic reasoning, thinking out of the box. "+GB},
{id:"p05",t:"prob",p:1,h:3,title:"Green Book 2.4 to 2.5",d:"Application of symmetry, series summation."},
{id:"p06",t:"prob",p:1,h:2.5,title:"Brainstellar Easy, first half",d:"No paper. Say the answer and the reasoning aloud before you check.",l:[["Brainstellar",L.bs]]},
{id:"p07",t:"prob",p:1,h:2.5,title:"Brainstellar Easy, second half",d:"Finish the Easy set.",l:[["Brainstellar",L.bs]]},
{id:"p08",t:"prob",p:1,h:4,title:"Green Book 4.1 to 4.2",d:"Basic probability definitions and set operations, combinatorial analysis."},
{id:"p09",t:"prob",p:1,h:4,title:"Green Book 4.3",d:"Conditional probability and Bayes' formula. Every problem in this section is a known interview question."},
{id:"p10",t:"prob",p:2,h:5,title:"Green Book 2.6 to 2.9",d:"Pigeonhole principle, modular arithmetic, induction, proof by contradiction."},
{id:"p11",t:"prob",p:1,h:3,title:"Brainstellar Medium, set 1",d:"About twelve problems, three minutes each on a timer. Mark the ones you missed.",l:[["Brainstellar",L.bs]]},
{id:"p12",t:"prob",p:1,h:3,title:"Brainstellar Medium, set 2",d:"Next twelve, same rules.",l:[["Brainstellar",L.bs]]},
{id:"p13",t:"prob",p:1,h:3.5,title:"Green Book 4.4",d:"Discrete and continuous distributions."},
{id:"p14",t:"prob",p:1,h:4.5,title:"Green Book 4.5",d:"Expected value, variance and covariance. Linearity of expectation and indicator variables should become your first move."},
{id:"p15",t:"prob",p:1,h:2.5,title:"Mosteller 1 to 8",d:"Fifty Challenging Problems in Probability. Short problems, famous answers."},
{id:"p16",t:"prob",p:1,h:2.5,title:"Mosteller 9 to 15",d:"Next seven."},
{id:"p17",t:"prob",p:1,h:3,title:"Order statistics",d:"Green Book 4.6, plus the order statistics section of Blitzstein chapter 8. Expected maximum and minimum of uniforms and of dice."},
{id:"p18",t:"prob",p:1,h:3,title:"Classics drill 1",d:"From a blank page, aloud, five minutes each: Monty Hall, two children, expected flips to HH and to HT, HTH against HHT, gambler's ruin, noodle ends, birthday problem, 100 prisoners and drawers, expected maximum of two dice, coupon collector, breaking a stick into a triangle, optimal stopping on a die with rerolls."},
{id:"p19",t:"prob",p:1,h:3,title:"Brainstellar Medium, set 3",d:"Timed, three minutes each.",l:[["Brainstellar",L.bs]]},
{id:"p20",t:"prob",p:1,h:3,title:"Brainstellar Medium, set 4",d:"Finish the Medium set.",l:[["Brainstellar",L.bs]]},
{id:"p21",t:"prob",p:1,h:5,title:"Green Book 5.1",d:"Markov chains: gambler's ruin, coin-sequence races, dice games. Solve each with first-step equations."},
{id:"p22",t:"prob",p:1,h:2.5,title:"Mosteller 16 to 23",d:"Next eight."},
{id:"p23",t:"prob",p:1,h:2.5,title:"Mosteller 24 to 30",d:"Next seven."},
{id:"p24",t:"prob",p:1,h:4,title:"Green Book 5.2",d:"Martingales and random walks. Learn the stopping-time shortcut for expected durations."},
{id:"p25",t:"prob",p:1,h:4,title:"Green Book 5.3",d:"Dynamic programming: dice games, optimal stopping, the secretary problem."},
{id:"p26",t:"prob",p:1,h:2.5,title:"Timed set A",d:"Twenty mixed problems at three minutes each from PuzzledQuant or the free QuantGuide questions. Score yourself honestly.",l:[["PuzzledQuant",L.pq],["QuantGuide",L.qg]]},
{id:"p27",t:"prob",p:1,h:3,title:"Mosteller 31 to 40",d:"Next ten."},
{id:"p28",t:"prob",p:1,h:3,title:"Mosteller 41 to 50",d:"Finish the book."},
{id:"p29",t:"prob",p:2,h:4.5,title:"Brainstellar Hard, first 15",d:"Ten minutes each before you look. These are harder than most interview questions.",l:[["Brainstellar",L.bs]]},
{id:"p30",t:"prob",p:1,h:2.5,title:"Timed set B",d:"Twenty more, three minutes each. Compare with set A.",l:[["PuzzledQuant",L.pq],["QuantGuide",L.qg]]},
{id:"p31",t:"prob",p:1,h:1.5,title:"Mock interview 1",d:"Five problems in 45 minutes, aloud, recorded on your phone. Listen back once: where did you go silent?"},
{id:"p32",t:"prob",p:1,h:2,title:"Classics drill 2",d:"The same list as drill 1, two minutes each this time."},
{id:"p33",t:"prob",p:1,h:1.5,title:"Mock interview 2",d:"With a friend if you can. They pick five problems and give hints only when you ask."},
{id:"p34",t:"prob",p:3,h:6,title:"Bonus: Heard on the Street, quantitative chapter",d:"Timothy Crack's book. Thirty selected problems from the purely quantitative and logic chapter."},
{id:"p35",t:"prob",p:3,h:4,title:"Bonus: three Jane Street monthly puzzles",d:"From the archive. Harder than interviews; good for stamina.",l:[["Puzzle archive",L.jsp]]},
{id:"p36",t:"prob",p:3,h:4,title:"Bonus: Blitzstein chapter 13",d:"Poisson processes. Read, then six exercises.",l:[["Stat 110",L.s110]]},
{id:"p37",t:"prob",p:3,h:4,title:"Bonus: the rest of Brainstellar Hard",d:"Ten minutes each.",l:[["Brainstellar",L.bs]]},

/* ---- BUILD ---- */
{id:"b01",t:"build",p:1,h:2,title:"NumPy tune-up",d:"You already write Python from the programming lab. Python Data Science Handbook chapter 2: arrays, broadcasting, random numbers.",l:[["Handbook",L.pdsh]]},
{id:"b02",t:"build",p:1,h:2,title:"pandas and plotting",d:"Chapter 3 basics (Series, DataFrame, groupby) and simple line and histogram plots from chapter 4.",l:[["Handbook",L.pdsh]]},
{id:"b03",t:"build",p:1,h:2,title:"Simulation lab 1",d:"Start a GitHub repository. Simulate five puzzles you have already solved and compare the simulated answer with the exact one."},
{id:"b04",t:"build",p:1,h:2,title:"Simulation lab 2",d:"Five more, including the HH against HTH race and gambler's ruin. Add a table of theory against simulation to the README."},
{id:"b05",t:"build",p:1,h:3,title:"Market-making simulator 1: the market",d:"A fair value that follows a random walk, and random buyers and sellers who trade against whatever quotes exist. No strategy yet."},
{id:"b06",t:"build",p:1,h:3,title:"Simulator 2: your quoting bot",d:"Quote a bid and an ask at a fixed spread around fair value. Track cash, inventory and profit. Plot all three."},
{id:"b07",t:"build",p:1,h:3,title:"Simulator 3: inventory control",d:"Shift both quotes against your position so you lean back toward flat. Compare the profit and its variance with the fixed-spread bot."},
{id:"b08",t:"build",p:2,h:3,title:"Simulator 4: informed traders",d:"Add traders who know where fair value is going. Sweep the spread and plot profit against how many informed traders there are. This is adverse selection, and you will have measured it yourself."},
{id:"b09",t:"build",p:1,h:2.5,title:"Write it up",d:"A README with three plots and three findings in plain words. This is your quant project for the resume and your answer to 'tell me about something you built'."},
{id:"b10",t:"build",p:1,h:3,due:"2027-01-17",lead:14,title:"Pokerbot 1: run the engine",d:"Clone last year's IIT Pokerbots engine, run the skeleton bot, read how a hand is played through the API. When ISTC releases this year's rules, read those first.",l:[["IIT Pokerbots",L.iitpb],["ISTC",L.istc]]},
{id:"b11",t:"build",p:1,h:3,due:"2027-01-17",lead:10,title:"Pokerbot 2: a pot-odds bot",d:"Estimate your chance of winning the hand, compare it with the pot odds, then fold, call or raise. This simple bot beats most first submissions.",l:[["MIT Pokerbots",L.mitpb]]},
{id:"b12",t:"build",p:2,h:3,due:"2027-01-17",lead:7,title:"Pokerbot 3: equity by simulation",d:"Monte Carlo the hand equity, size bets by strength, and test against your own earlier bot."},
{id:"b13",t:"build",p:1,h:2,title:"Resume draft and proofs folder",d:"One page. Start a folder with proof for every line (certificates, links, screenshots); the institute asks for it in June."},
{id:"b14",t:"build",p:3,h:5,title:"Bonus: Prosperity warm-up",d:"Read two write-ups from last year's top teams and run a tutorial-round bot. The real competition is expected in April.",l:[["Prosperity",L.pros]]},
{id:"b15",t:"build",p:3,h:12,title:"Bonus: limit order book in C++",d:"Price-time priority matching with std::map. A spring project; it only shows up here if you are far ahead."},

/* ---- TRADING ---- */
{id:"t01",t:"trade",p:1,h:2,title:"Read Jane Street's Probability and Markets guide",d:"Short and free. It explains what an interviewer means by 'make me a market'.",l:[["The guide (PDF)",L.jsg]]},
{id:"t02",t:"trade",p:1,h:2,title:"Mental math toolkit",d:"Arthur Benjamin, Secrets of Mental Math, chapters 1 to 3: left-to-right addition, two-digit by one-digit, squaring two-digit numbers. Memorise halves through twelfths as decimals."},
{id:"t03",t:"trade",p:1,h:1.5,title:"Market making, solo",d:"Six rounds. Make a two-sided market on the sum of three dice, then on heads in ten flips. Reveal one die or two flips and requote. Write down your fair value and why your spread is that wide."},
{id:"t04",t:"trade",p:1,h:2,title:"Figgie, ten rounds",d:"Jane Street's trading card game, free in the browser. Play to learn what it feels like to trade with incomplete information.",l:[["Figgie",L.fig]]},
{id:"t05",t:"trade",p:1,h:2,title:"Expected value and bet sizing",d:"Read up on the Kelly criterion, then six betting puzzles from Brainstellar or the Green Book. For each: what is the edge, and how much would you stake?",l:[["Brainstellar",L.bs]]},
{id:"t06",t:"trade",p:1,h:1.5,title:"Estimation and calibration",d:"Twenty estimation questions (city populations, distances, counts). Give a 90% range for each. You are calibrated if 16 to 19 of the 20 ranges contain the truth."},
{id:"t07",t:"trade",p:1,h:1.5,title:"Eighty questions in eight minutes, three sittings",d:"The Optiver-style arithmetic test, where wrong answers cost marks. Do three sittings on different days and log each score.",l:[["TraderMath",L.tm]]},
{id:"t08",t:"trade",p:2,h:1,title:"Number sequences, two sets",d:"Pattern-spotting sets of the kind trading firms use in online assessments.",l:[["TraderMath",L.tm]]},
{id:"t09",t:"trade",p:1,h:1.5,title:"Market making against a counterparty, three sessions",d:"A friend, or a Claude chat told to act as a customer who trades against your quotes and reveals information in stages. Thirty minutes each."},
{id:"t10",t:"trade",p:1,h:2,due:"2027-01-17",lead:16,title:"Poker math",d:"Hand rankings, pot odds, equity, the expected value of a call. The first MIT Pokerbots lecture covers all of it.",l:[["MIT Pokerbots",L.mitpb]]},
{id:"t11",t:"trade",p:1,h:2,due:"2027-01-25",lead:14,title:"Pricing a live game",d:"The ISTC Trading League makes markets on a simulated live sports match. Practise ten scenarios: price 'team A wins' as the score and the clock change, and say how your quote should move after each event.",l:[["ISTC",L.istc]]},
{id:"t12",t:"trade",p:1,h:1,due:"2027-01-16",lead:8,title:"Read the Quantile and ISTC formats",d:"Read both rule sets as soon as they are published and work through any sample questions.",l:[["Quantile",L.qtl],["ISTC",L.istc]]},
{id:"t13",t:"trade",p:2,h:1.5,title:"Figgie, ten more rounds",d:"This time with one goal: never hold a position you cannot explain.",l:[["Figgie",L.fig]]},
{id:"t14",t:"trade",p:1,h:1,title:"Your market-making checklist",d:"One page in your own words: how you set fair value, how wide you quote and why, what you do after you get hit. You will reread this before every trading interview."},
{id:"h01",t:"hw",p:1,h:1.5,due:"2026-12-01",lead:10,title:"RTOS: agree what finished means",d:"Message the Abhyuday lead before you write any code. Which board and sensors, which tasks the flight computer must run, who owns the flight logic, what you hand over, and by when. Write the answers in the team repo. The drills below assume FreeRTOS on the STM32H743; change them if the answers differ."},
{id:"h02",t:"hw",p:1,h:3,title:"RTOS 1: tasks, scheduling, memory",d:"Shawn Hymel's Introduction to RTOS, parts 1 to 4, on your ESP32. Do each challenge yourself before you watch his solution.",l:[["Intro to RTOS, part 1",L.rtos],["FreeRTOS kernel book",L.frbook]]},
{id:"h03",t:"hw",p:1,h:3,title:"RTOS 2: queues, mutexes, semaphores",d:"Parts 5 to 7. Build the producer and consumer exercise with a queue, then break it on purpose with a shared variable and fix it with a mutex.",l:[["Intro to RTOS, part 1",L.rtos]]},
{id:"h04",t:"hw",p:1,h:2.5,title:"RTOS 3: timers and interrupts",d:"Parts 8 and 9. Software timers, and passing data from an interrupt to a task with the FromISR calls. This is how a sensor's data-ready interrupt reaches your code.",l:[["Intro to RTOS, part 1",L.rtos]]},
{id:"h05",t:"hw",p:1,h:2.5,title:"RTOS 4: deadlock, starvation, priority inversion",d:"Parts 10 to 12. For each failure, write two lines on how it could happen in the flight computer and how you will prevent it. Those lines go into your design note.",l:[["Intro to RTOS, part 1",L.rtos]]},
{id:"h06",t:"hw",p:1,h:3,title:"RTOS 5: FreeRTOS on the STM32",d:"Generate a FreeRTOS project in CubeIDE. Move the HAL timebase off SysTick to a spare timer when CubeMX asks, pick heap_4, and decide with the team whether you write against the CMSIS-RTOS wrapper or the native FreeRTOS calls. Two tasks: a heartbeat LED and a UART print once a second. No flight computer at home? Use any STM32 board you can borrow.",l:[["STM32 and FreeRTOS",L.stmrtos],["FreeRTOS kernel book",L.frbook]]},
{id:"h07",t:"hw",p:1,h:2.5,title:"RTOS 6: the design on one page",d:"Before more code: a table of every task with its rate, priority and stack size, every queue with what flows through it, what runs in an interrupt and what runs in a task, and the flight states. Send it to the lead and get a yes. This page is what makes the rest go well."},
{id:"h08",t:"hw",p:1,h:4,title:"RTOS 7: skeleton that runs",d:"Sensor task at a fixed rate with vTaskDelayUntil, logger task, telemetry task, joined by queues, all with fake data first. Nothing else until this runs for an hour without a hiccup."},
{id:"h09",t:"hw",p:1,h:4,title:"RTOS 8: real sensors under the RTOS",d:"Bring in the barometer and one other sensor. One mutex per bus. The interrupt wakes its task with a task notification and does nothing else. Any interrupt that calls a FromISR function must sit at or below the kernel's maximum syscall priority; getting that wrong is the classic crash. On the H7, read ST's note on DMA with the data cache before you enable both."},
{id:"h10",t:"hw",p:1,h:3,title:"RTOS 9: logging that survives",d:"The sensor task never waits on storage: it pushes to a queue and the logger drains it to the F-RAM. Give every record a sequence number and a checksum so a reset in the middle of a write is detectable. Pull the power mid-run and prove the log reads back."},
{id:"h11",t:"hw",p:1,h:3.5,title:"RTOS 10: flight states and watchdog",d:"A state machine for pad, boost, coast, descent and landed. A supervisor task feeds the hardware watchdog only when every other task has checked in. Log the reset reason at every boot.",l:[["Watchdog guide",L.wdog]]},
{id:"h12",t:"hw",p:1,h:2.5,title:"RTOS 11: break it on purpose",d:"Turn on stack overflow checking, the malloc-failed hook and configASSERT, and write a HardFault handler that records where it happened. Then cause each failure on the bench and confirm the board logs it and recovers.",l:[["Stack overflow checking",L.frstack],["Debugging a HardFault",L.hfault]]},
{id:"h13",t:"hw",p:1,h:2.5,title:"RTOS 12: prove the timing",d:"Toggle a pin in the sensor task and measure the worst jitter over ten minutes while the logger and telemetry are busy. Record each task's stack high-water mark and CPU share. Put the numbers in a table. This table is what separates done from done well."},
{id:"h14",t:"hw",p:1,h:3,title:"RTOS 13: fly it on the bench",d:"Feed a recorded or simulated pressure profile into the sensor queue and watch every state change fire at the right moment, apogee included. Run it ten times. Nothing connected to the pyro channels."},
{id:"h15",t:"hw",p:1,h:2.5,title:"RTOS 14: hand it over",d:"README, the design page, the timing table, a list of known limits, code pushed and tagged in the team repo, and a walkthrough with the lead. Ask them to try to break it."},
{id:"h16",t:"hw",p:1,h:2.5,title:"HDLBits 1: language basics and vectors",d:"Getting Started, then Verilog Language: Basics and Vectors. You have built adders in Vivado, so move fast and stop only on what surprises you.",l:[["HDLBits",L.hdl]]},
{id:"h17",t:"hw",p:1,h:2.5,title:"HDLBits 2: modules and procedures",d:"Modules: Hierarchy, then Procedures. Know cold why an incomplete if or case creates a latch, and how blocking and non-blocking assignment differ. Both are standard interview questions.",l:[["HDLBits",L.hdl]]},
{id:"h18",t:"hw",p:1,h:2.5,title:"HDLBits 3: combinational circuits",d:"More Verilog Features, then Circuits: basic gates, multiplexers, arithmetic circuits, Karnaugh maps.",l:[["HDLBits",L.hdl]]},
{id:"h19",t:"hw",p:1,h:3,title:"HDLBits 4: flip-flops and counters",d:"Sequential Logic: Latches and Flip-Flops, then Counters.",l:[["HDLBits",L.hdl]]},
{id:"h20",t:"hw",p:2,h:2.5,title:"HDLBits 5: shift registers and more circuits",d:"Shift Registers, then More Circuits.",l:[["HDLBits",L.hdl]]},
{id:"h21",t:"hw",p:2,h:4,title:"HDLBits 6: state machines, part 1",d:"Finite State Machines, from the simple ones through the Lemmings set. State machines are most of what an FPGA interview asks.",l:[["HDLBits",L.hdl]]},
{id:"h22",t:"hw",p:2,h:4,title:"HDLBits 7: state machines, part 2",d:"The rest of the state machine set: the serial receiver, PS/2 packets, sequence recognisers. The serial receiver is the UART project in miniature.",l:[["HDLBits",L.hdl]]},
{id:"h23",t:"hw",p:2,h:2,title:"HDLBits 8: testbenches",d:"Verification: Finding Bugs in Code, Build a Circuit from a Simulation Waveform, Writing Testbenches.",l:[["HDLBits",L.hdl]]},
{id:"h24",t:"hw",p:2,h:3,title:"Project 1: UART transmitter",d:"Your own Verilog, 115200 baud, 8 data bits, no parity, one stop bit, with a self-checking testbench in Vivado's simulator. Read a reference design only after yours passes.",l:[["nandland UART",L.uart]]},
{id:"h25",t:"hw",p:2,h:3,title:"Project 2: UART receiver and loopback",d:"A receiver with 16 times oversampling. Wire transmitter to receiver in the testbench and send 1,000 random bytes. Zero mismatches or it is not done.",l:[["nandland UART",L.uart]]},
{id:"h26",t:"hw",p:3,h:3,title:"Project 3: FIFO, synthesis, write-up",d:"Add a small synchronous FIFO, run synthesis for the Basys 3 and record the LUT count and worst slack. A README with a waveform screenshot, on GitHub."},
{id:"h27",t:"hw",p:3,h:2,title:"HDLBits 9: building larger circuits",d:"The last sequential section. It chains counters, shift registers and state machines into one timer.",l:[["HDLBits",L.hdl]]},
{id:"h28",t:"hw",p:3,h:10,due:"2027-01-18",lead:30,title:"Jane Street chip design competition",d:"A reprogrammable protocol emulator chip in Verilog on the Tiny Tapeout template, due 18 Jan. Jane Street calls it a big project and recommends teams. Only with two teammates who know Verilog, and only once the flight computer work is handed over.",l:[["Competition post",L.jsasic],["Tiny Tapeout template",L.tt]]},
{id:"h29",t:"hw",p:3,h:8,title:"Market-data parser in Verilog",d:"Parse a fixed-format price message arriving one byte at a time and keep the best bid and offer in registers. This is a low-latency firm's daily work in miniature, and the strongest thing you could show an FPGA interviewer."}
];

{id:"a3",due:"2026-11-22",gone:"2026-12-05",title:"Decide: free route or a paid contest course",d:"The DSA track is written for the free route (NeetCode, USACO Guide, CSES). If you buy a course, its lessons replace the USACO Guide drills; the practice drills stay."},
{id:"a4",due:"2026-11-25",gone:"2026-12-10",title:"Find out when the next semester starts",d:"Then set the arc's end date in the Chamber tab. Everything reschedules around it."},

{id:"a7",due:"2026-12-05",gone:"2027-01-17",title:"Sign up for the Quantile registration alert",d:"Registration 'opens soon'. The first round is online on 17 Jan.",l:[["Quantile",L.qtl]]},
{id:"a8",due:"2026-12-20",gone:"2027-01-17",title:"Ask two seniors about last season",d:"Which quant firms came, what each online assessment looked like, and what CGPA they shortlisted at. Ten minutes of their time saves you weeks."},
{id:"a9",from:"2026-12-01",due:"2027-01-10",gone:"2027-01-31",title:"Check IICPC Codefest 2027 dates and register",d:"Not announced yet. Last year registration closed on 15 Jan and prelims were on 31 Jan.",l:[["Codefest",L.cfest]]},

function blank(){return {v:2,ts:0,done:{},dtype:{},daily:{},logs:[],ev:{},keep:{},voice:"v",base:"full",start:DEF_START,end:DEF_END}}
function norm(s){var b=blank();if(!s||typeof s!=="object")return b;for(var k in b){if(s[k]!==undefined&&s[k]!==null)b[k]=s[k]}if(!Array.isArray(b.logs))b.logs=[];if(!VOICE[b.voice])b.voice="v";if(b.base!=="max")b.base="full";
  if(typeof b.start!=="string"||b.start<"2026-11-20"||b.start>"2026-12-15")b.start=DEF_START;
  if(typeof b.end!=="string"||b.end<addDays(b.start,21))b.end=DEF_END;return b}
function pad(n){return n<10?"0"+n:""+n}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function today(){return fmt(new Date(Date.now()-4*3600e3))} /* a training day ends at 4am */
function nice(s){return parse(s).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function shortd(s){return parse(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}

function dayType(d){if(d<S.start||d>S.end)return "off";if(S.dtype[d])return S.dtype[d];return parse(d).getDay()===0?"half":(S.base==="max"?"max":"full")}

/* ---------- the scheduler ---------- */
function capacity(t,from){var c=0,d=from<S.start?S.start:from;for(;d<=S.end;d=addDays(d,1))c+=BUD[dayType(d)][t];return c}
function planTrack(t){
  var td=today(), after=td>S.end;
  var qs=Q.filter(function(q){return q.t===t});
  var und=qs.filter(function(q){return !S.done[q.id]});
  var doneToday=sum(qs.filter(function(q){return S.done[q.id]===td}));
  var cap=Math.max(0,capacity(t,td)-Math.min(doneToday,BUD[dayType(td)][t]));
  var core=und.filter(function(q){return q.p<=2});
  var H=sum(core), deferred={}, nDef=0, bonus={};
  if(!after&&H>cap){for(var i=core.length-1;i>=0&&H>cap;i--){var q=core[i];if(q.p===2&&!S.keep[q.id]){deferred[q.id]=1;nDef++;H-=q.h}}}
  var over=after?0:Math.max(0,H-cap);
  if(!after&&!nDef&&over===0){var room=cap*0.85-H;und.forEach(function(q){if(q.p===3&&q.h<=room){bonus[q.id]=1;room-=q.h}})}
  var act=und.filter(function(q){return q.p<=2&&!deferred[q.id]}).concat(und.filter(function(q){return bonus[q.id]}));
  var pin=act.filter(function(q){return q.due&&diff(td,q.due)<=(q.lead||10)});
  var active=pin.concat(act.filter(function(q){return pin.indexOf(q)<0}));
  var fin=null, acc=-Math.min(doneToday,BUD[dayType(td)][t]);
  if(H<=0)fin=td; else for(var d=td<S.start?S.start:td;d<=S.end;d=addDays(d,1)){acc+=BUD[dayType(d)][t];if(acc>=H){fin=d;break}}
  return {t:t,qs:qs,und:und,active:active,deferred:deferred,nDef:nDef,bonus:bonus,cap:cap,H:H,over:over,fin:fin,coreLeft:core.length-nDef,
    doneCore:sum(qs.filter(function(q){return q.p<=2&&S.done[q.id]})),totalH:sum(qs.filter(function(q){return q.p<=2}))};
}
function todayList(P){
  var td=today(), b=BUD[dayType(td)][P.t];
  var doneT=P.qs.filter(function(q){return S.done[q.id]===td});
  var used=sum(doneT), next=[], extra=EXTRA[P.t];
  for(var i=0;i<P.active.length;i++){var q=P.active[i];
    if(b>0&&used<b){next.push(q);used+=q.h}else if(extra>0){next.push(q);extra--}else break}
  return {b:b,doneT:doneT,next:next,more:P.active.length>next.length};
}
function totals(){
  var xp=0,core=0,n=0,c=0,k=0;
  Q.forEach(function(q){if(q.p<=2)core+=xpOf(q);if(S.done[q.id]){xp+=xpOf(q);n+=q.n||0;c+=q.c||0;k+=q.k||0}});
  for(var d in S.daily){var o=S.daily[d];if(o){if(o.z)xp+=5;if(o.r)xp+=5;if(o.e)xp+=5}}
  var fi=0,at=0,nextAt=null,nextName=null;
  for(var i=0;i<FORMS.length;i++){if(xp>=FORMS[i][1]*core){fi=i;at=Math.ceil(FORMS[i][1]*core);if(FORMS[i+1]){nextAt=Math.ceil(FORMS[i+1][1]*core);nextName=FORMS[i+1][0]}else{nextAt=null;nextName=null}}}
  return {xp:xp,core:core,fi:fi,form:FORMS[fi][0],at:at,nextAt:nextAt,nextName:nextName,n:n,c:c,k:k};
}
function instinct(){
  var z=zscores(),best=z.length?Math.max.apply(null,z.map(function(p){return p[1]})):0,lvl=0;
  for(var i=0;i<INSTINCT_AT.length;i++)if(best>=INSTINCT_AT[i])lvl=i+1;
  return {best:best,lvl:lvl,name:INSTINCT[lvl],next:lvl<3?INSTINCT_AT[lvl]:null,nextName:lvl<3?INSTINCT[lvl+1]:null};
}
function activeDays(){var m={};for(var id in S.done)m[S.done[id]]=1;for(var d in S.daily){var o=S.daily[d];if(o&&(o.z||o.r||o.e))m[d]=1}return m}
function trainedDays(){var m=activeDays(),n=0;for(var d in m)if(d>=S.start)n++;return n}
function missedYesterday(){var td=today(),y=addDays(td,-1);if(y<S.start||td>S.end)return false;var k=dayType(y);if(k==="rest"||k==="off")return false;return !activeDays()[y]}
function weekCount(){return Math.max(1,Math.ceil((diff(S.start,S.end)+1)/7))}
function weekOf(d){return Math.max(0,Math.floor(diff(S.start,d)/7))}
function weekStats(i){
  var a=addDays(S.start,7*i),b=addDays(a,6);if(b>S.end)b=S.end;var plan=0;
  for(var d=a;d<=b;d=addDays(d,1)){var k=BUD[dayType(d)];ORDER.forEach(function(t){plan+=k[t]||0})}
  var hp=Math.round(plan*0.75*2)/2,dmg=0;
  Q.forEach(function(q){var x=S.done[q.id];if(x&&x>=a&&x<=b)dmg+=q.h});
  var r=RIVALS[Math.min(i,RIVALS.length-1)];
  return {i:i,a:a,b:b,hp:hp,dmg:dmg,won:hp>0&&dmg>=hp,name:r[0],line:r[1]};
}
function zscores(){var a=[];for(var d in S.daily){var o=S.daily[d];if(o&&o.zs>0)a.push([d,o.zs])}S.logs.forEach(function(g){if(g.z>0)a.push([g.d,g.z])});a.sort(function(x,y){return x[0]<y[0]?-1:x[0]>y[0]?1:y[1]-x[1]});var out=[],last=null;a.forEach(function(p){if(p[0]!==last){out.push(p);last=p[0]}});return out}

function dueLabel(dd,due){return dd<0?(-dd)+" day"+(dd===-1?"":"s")+" late · "+shortd(due):dd===0?"Due today":dd===1?"Due tomorrow":"Due "+shortd(due)}
function rowHtml(o){
  var open=!!OPEN[o.id];
  return '<div class="q'+(o.done?" done":"")+'"'+(o.t?' data-t="'+o.t+'"':"")+">"+
    '<button class="qtick" data-act="tick" data-id="'+o.id+'" aria-pressed="'+!!o.done+'"><span class="chk"></span><span class="qtx"><span class="qt">'+esc(o.title)+"</span>"+(o.meta?'<span class="qm">'+o.meta+"</span>":"")+"</span></button>"+
    '<button class="qx" data-act="open" data-id="'+o.id+'" aria-expanded="'+open+'" aria-label="Details: '+esc(o.title)+'"></button>'+
    (o.after?'<div class="qk">'+o.after+"</div>":"")+(open?'<div class="qd">'+o.body+"</div>":"")+"</div>";
}
function questHtml(q,opt){
  opt=opt||{};var done=!!S.done[q.id],tags="";
  if(q.p===2)tags+='<span class="tag">Flex</span>';
  if(q.p===3)tags+='<span class="tag good">Limit break</span>';
  if(opt.deferred)tags+='<span class="tag warn">Moved to spring</span>';
  if(q.due&&!done){var dd=diff(today(),q.due);if(dd<=(q.lead||10))tags+='<span class="tag '+(dd<=3?"hot":"soon")+'">'+dueLabel(dd,q.due)+"</span>"}
  return rowHtml({id:q.id,t:q.t,title:q.title,done:done,meta:'<span class="xp">'+hrs(q.h)+" drill · +"+xpOf(q)+" ki</span>"+tags,
    body:"<p>"+esc(q.d)+"</p>"+linksHtml(q.l),after:opt.deferred&&!done?'<button class="ghost" data-act="keep" data-id="'+q.id+'">Keep it in winter</button>':""});
}
function paceTag(P){
  if(today()>S.end)return "";
  if(P.coreLeft===0&&!P.nDef)return '<span class="tag good pace">Core complete</span>';
  if(P.over>0)return '<span class="tag hot pace">'+hrs(P.over)+" over the time left</span>";
  if(P.nDef)return '<span class="tag warn pace">'+P.nDef+" moved to spring</span>";
  return "";
}
function fill(t,o){return t.replace(/\{(\w+)\}/g,function(m,k){return o[k]!==undefined?o[k]:""})}
function coach(plans){
  var td=today(),k=dayType(td),V=VOICE[S.voice]||VOICE.v,msg,sub="";
  if(td<S.start){var n=diff(td,S.start);msg=fill(V.pre,{n:n,s:n===1?"":"s",d:nice(S.start)});sub="Until then only the deadlines below need you.";}
  else if(td>S.end){msg=V.after;sub="Ask Claude for the semester version of this plan.";}
  else if(k==="rest"){msg=V.rest;}
  else{
    var bad=plans.filter(function(P){return P.over>0}),moved=plans.filter(function(P){return P.nDef>0}),left=0,any=false;
    plans.forEach(function(P){var T=todayList(P);left+=T.next.length;if(T.doneT.length)any=true});
    if(any&&left===0){msg=V.done;}
    else if(bad.length){msg=fill(V.behind,{t:TRACKS[bad[0].t].name,h:hrs(bad[0].over)});sub="Turning a rest day into a training day, or moving the closing date in Chamber, also fixes it.";}
    else if(missedYesterday()){msg=V.back;}
    else if(moved.length){var tot=moved.reduce(function(a,P){return a+P.nDef},0);msg=fill(V.moved,{n:tot,s:tot===1?"":"s"});sub="See which in Chamber. You can pull any of them back.";}
    else{msg=V.tips[(diff(S.start,td)+V.tips.length*10)%V.tips.length];}
  }
  return {msg:msg,sub:sub,who:V.name,mark:V.mark};
}

function deadlinesHtml(){
  var td=today();

  var doneT=A.filter(function(a){return S.done[a.id]===td});
  if(!list.length&&!doneT.length)return "";

  var first=list[0],late=list.filter(function(a){return diff(td,a.due)<=1}).length,rows="";
  doneT.concat(list).forEach(function(a){

}

function sheetHtml(plans,withDailies){
  var td=today(),k=dayType(td),b="",more=false,hours=0;
  plans.forEach(function(P){
    var T=todayList(P);if(!(T.b>0||T.doneT.length||td>S.end))return;
    var rows=T.doneT.concat(T.next);if(T.more)more=true;hours+=T.b;
    b+='<div class="grp" data-t="'+P.t+'"><span class="gchip"><span>'+esc(TRACKS[P.t].name)+'</span></span><span class="gsub">'+(T.b?hrs(T.b)+" block · "+TRACKS[P.t].when:"")+"</span>"+paceTag(P)+"</div>";
    if(!rows.length)b+='<p class="txt muted">'+(P.active.length?"Nothing scheduled here today.":"Everything in this track is done.")+"</p>";
    rows.forEach(function(q){b+=questHtml(q)});
  });

function drawAura(f){
  var W=auraCv.width,H=auraCv.height,c=auraCx,cols=AURA[auraRank]||AURA[0],cx=W/2,base=H*0.93,R=W*0.47;
  c.clearRect(0,0,W,H);

  var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,skyCols.sky1);g.addColorStop(.55,skyCols.sky2);g.addColorStop(1,skyCols.sky3);c.fillStyle=g;c.fillRect(0,0,W,H);

  for(var k=0;k<sparks.length;k++){var p=sparks[k];p.y-=p.v*dt;p.w+=dt*2;if(p.y<-.05)sparks[k]=p=newSpark(false);
    var x=(p.x+Math.sin(p.w)*.006)*W,y=p.y*H,s=p.s*skyDpr,al=Math.min(1,(1-p.y)*3)*Math.min(1,p.y*4+.2);

/* ---------- saving and sync ----------
   Every change is saved on the device first. When Supabase is set up in config.js and you are signed in,
   the whole state is one row per account. Newer state wins; if another device wrote since this one last
   synced, the two are merged (ticks from both are kept) before writing. */
var CFG=window.WA_CONFIG||{}, SB=null, user=null, syncState="local", wt=null, busy=Promise.resolve(), lastPull=0, authMsg="", authBad=false;
var SEEN=LS+".seen";
function seen(){try{return +localStorage.getItem(SEEN)||0}catch(e){return 0}}
function setSeen(t){try{localStorage.setItem(SEEN,String(t))}catch(e){}}
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(st){if(st===syncState)return;syncState=st;render()}
function save(){S.ts=Date.now();cache();if(user){setSync("saving");clearTimeout(wt);wt=setTimeout(function(){wt=null;queue(push)},700)}render()}
function queue(fn){busy=busy.then(fn).catch(function(){setSync("error")});return busy}
function merge(r,l){
  var o=norm(JSON.parse(JSON.stringify(r)));
  ["done","dtype","ev","keep"].forEach(function(k){o[k]=Object.assign({},r[k]||{},l[k]||{})});
  o.daily=JSON.parse(JSON.stringify(r.daily||{}));for(var d in (l.daily||{}))o.daily[d]=Object.assign({},o.daily[d]||{},l.daily[d]);
  var keys={};o.logs=[];(r.logs||[]).concat(l.logs||[]).forEach(function(g){var k=JSON.stringify(g);if(!keys[k]){keys[k]=1;o.logs.push(g)}});
  o.logs.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  ["voice","base","start","end"].forEach(function(k){o[k]=l[k]});
  return o;
}
function remote(){return SB.from("arc_state").select("state").eq("user_id",user.id).maybeSingle().then(function(res){if(res.error)throw res.error;return res.data?res.data.state:null})}
function write(st){return SB.from("arc_state").upsert({user_id:user.id,state:st,updated_at:new Date().toISOString()}).then(function(res){if(res.error)throw res.error})}
function push(){
  if(!user)return;setSync("saving");
  return remote().then(function(r){
    if(r&&(r.ts||0)>seen()&&(r.ts||0)!==(S.ts||0)){S=norm(merge(r,S));S.ts=Date.now();cache()}
    var body=JSON.parse(JSON.stringify(S));
    return write(body).then(function(){setSeen(body.ts);lastPull=Date.now();if(!wt)setSync("synced")});
  });
}
function pull(){
  if(!user)return;setSync(syncState==="synced"?"synced":"saving");
  return remote().then(function(r){
    lastPull=Date.now();
    if(!r){return push()}
    if((r.ts||0)>(S.ts||0)){
      if((S.ts||0)>seen()){S=norm(merge(r,S));S.ts=Date.now();cache();render();return push()}
      S=norm(r);cache();setSeen(r.ts||0);render();setSync("synced");return;
    }
    if((S.ts||0)>(r.ts||0))return push();
    setSeen(r.ts||0);setSync("synced");
  });
}
function initSync(){
  if(!CFG.url||!CFG.key||!window.supabase){syncState="off";render();return}
  SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"winterarc.auth"}});
  syncState="signedout";
  SB.auth.onAuthStateChange(function(evt,session){
    var was=user&&user.id;user=session?session.user:null;
    if(!user){setSync("signedout");return}
    if(user.id!==was){setTimeout(function(){queue(pull)},0)}  /* never call Supabase inside this callback */
  });
  SB.auth.getSession().then(function(res){var se=res.data&&res.data.session;if(!se){setSync("signedout");render()}});
  function wake(){if(!user)return;if(syncState==="error"||(S.ts||0)>seen())queue(push);else if(Date.now()-lastPull>15000)queue(pull)}
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")wake()});
  window.addEventListener("focus",wake);window.addEventListener("online",wake);
  setInterval(function(){if(document.visibilityState==="visible")wake()},60000);
}

}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;var act=el.dataset.act;

  else if(act==="bk-copy"){var c=backupCode();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(function(){toast("Backup code copied")},function(){prompt("Copy this code",c)})}else prompt("Copy this code",c)}
  else if(act==="bk-load"){var t=(document.getElementById("bk-in").value||"").trim();if(!t){toast("Paste a code first");return}
    try{var n=norm(JSON.parse(decodeURIComponent(escape(atob(t)))));if(!confirm("Replace this device's progress with the backup?"))return;S=n;save();toast("Restored")}catch(e){toast("That code did not work")}}
});
document.addEventListener("submit",function(ev){
  var f=ev.target;if(!f.dataset||f.dataset.form!=="auth")return;ev.preventDefault();if(!SB)return;
  var mode=ev.submitter&&ev.submitter.value==="up"?"up":"in",em=document.getElementById("au-e").value.trim(),pw=document.getElementById("au-p").value;
  if(!em||pw.length<8){authMsg="Enter your email and a password of at least 8 characters.";authBad=true;render();return}
  authMsg=mode==="up"?"Creating account…":"Signing in…";authBad=false;render();
  var p=mode==="up"?SB.auth.signUp({email:em,password:pw}):SB.auth.signInWithPassword({email:em,password:pw});
  p.then(function(res){
    if(res.error){authMsg=res.error.message||"That did not work.";authBad=true;render();return}
    if(mode==="up"&&!res.data.session){authMsg="Account created. Open the confirmation email, tap the link, then come back here and sign in.";authBad=false;render();return}
    authMsg="";authBad=false;toast("Signed in");render();
  },function(){authMsg="Could not reach the server. Check your connection.";authBad=true;render()});
});

/* ---------- events ---------- */
function find(id){for(var i=0;i<Q.length;i++)if(Q[i].id===id)return Q[i];for(var j=0;j<A.length;j++)if(A[j].id===id)return A[j];return null}
document.addEventListener("click",function(ev){
  var tb=ev.target.closest(".tabs button");if(tb){tab=tb.dataset.tab;try{localStorage.setItem(LS+".tab",tab)}catch(e){}render();var v=document.querySelector(".tabs").getBoundingClientRect();if(v.top<=1)window.scrollTo(0,window.scrollY+document.getElementById("view").getBoundingClientRect().top-v.height-8);return}
  var el=ev.target.closest("[data-act]");if(!el)return;var act=el.dataset.act,id=el.dataset.id,td=today();
  if(act==="tick"){var q=find(id);if(!q)return;var f0=totals().fi;if(S.done[id]){delete S.done[id]}else{S.done[id]=td;pow(ev.clientX,ev.clientY,q.h?"+"+xpOf(q)+" ki":"Done")}save();var f1=totals();if(f1.fi>f0)toast("Transformation: "+f1.form)}
  else if(act==="daily"){var g0=totals().fi,o=S.daily[td]||(S.daily[td]={});o[id]=!o[id];if(o[id])pow(ev.clientX,ev.clientY,"+5 ki");save();var g1=totals();if(g1.fi>g0)toast("Transformation: "+g1.form)}
  else if(act==="type"){S.dtype[td]=id;save()}
  else if(act==="cycle"){var k=dayType(id);S.dtype[id]=TYPES[(TYPES.indexOf(k)+1)%TYPES.length];save()}
  else if(act==="more"){ORDER.forEach(function(t){EXTRA[t]++});render()}
  else if(act==="voice"){S.voice=id;save()}
  else if(act==="base"){S.base=id;save()}
  else if(act==="open"){if(OPEN[id])delete OPEN[id];else OPEN[id]=1;render()}
  else if(act==="load"){var k0=dayType(td);S.dtype[td]=TYPES[(TYPES.indexOf(k0)+1)%TYPES.length];save()}
  else if(act==="step"){var pr=id.split(":"),nv=addDays(S[pr[0]],+pr[1]),ok=pr[0]==="start"?(nv>="2026-11-20"&&nv<=addDays(S.end,-21)):(nv>=addDays(S.start,21)&&nv<="2027-02-28");if(ok){S[pr[0]]=nv;save()}else toast("That is as far as it goes")}
  else if(act==="keep"){S.keep[id]=true;save()}
  else if(act==="dellog"){S.logs.splice(+id,1);save()}
});
document.addEventListener("change",function(ev){
  var el=ev.target;if(!el.dataset||!el.dataset.act)return;var act=el.dataset.act,td=today();
  if(act==="zs"){var v=Math.max(0,Math.min(200,parseInt(el.value,10)||0));var o=S.daily[td]||(S.daily[td]={});o.zs=v;if(v>0&&!o.z){o.z=true;toast("+5 ki")}save()}
  else if(act==="ev"){S.ev[el.dataset.id]=el.value;save()}
  else if(act==="end"){if(el.value&&el.value>=addDays(S.start,21)&&el.value<="2027-02-28"){S.end=el.value;save()}else{toast("Pick a later end date");render()}}
  else if(act==="start"){if(el.value&&el.value>="2026-11-20"&&el.value<="2026-12-15"&&el.value<=addDays(S.end,-21)){S.start=el.value;save()}else{toast("Pick an earlier start date");render()}}
});
document.addEventListener("submit",function(ev){
  var f=ev.target;if(!f.dataset||f.dataset.form!=="trial")return;ev.preventDefault();
  function num(id,max){var v=document.getElementById(id).value;if(v==="")return null;v=parseInt(v,10);return isNaN(v)?null:Math.max(0,Math.min(max,v))}
  var g={d:today(),z:num("tr-z",200),p:num("tr-p",8),s:num("tr-s",12),c:(document.getElementById("tr-c").value||"").slice(0,40)};
  if(g.z==null&&g.p==null&&g.s==null){toast("Enter at least one number");return}
  S.logs.push(g);toast("Logged");save();
});
document.addEventListener("toggle",function(ev){var d=ev.target;if(d&&d.dataset&&d.dataset.d){if(d.open)OPEN[d.dataset.d]=1;else delete OPEN[d.dataset.d]}},true);

sizeAura();render();
window.addEventListener("resize",function(){sizeAura();drawAura(auraFrame)});
if(window.matchMedia){var mq=window.matchMedia("(prefers-color-scheme: dark)");if(mq.addEventListener)mq.addEventListener("change",render)}
if(!reduce){requestAnimationFrame(auraLoop);requestAnimationFrame(skyLoop)}else drawSky(0);
initSync();
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
